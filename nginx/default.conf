server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查端点
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
